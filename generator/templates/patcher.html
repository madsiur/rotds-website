{% include 'header.html' %}
    <body class="page-color d-flex flex-column h-100">
        {% include 'menu.html' %}
        <main class="flex-grow-1">
            <div class="d-flex justify-content-center mt-2">
                <h3 id="pageTitle">Patcher</h3>
            </div>
            <div class="container px-2 px-sm-3">
                <div class="card patcher-card position-relative">
                    <div class="card-body">
                        <div class="row mb-3 align-items-center">
                            <label for="romFile" class="col-12 col-sm-4 col-form-label text-sm-end">ROM file:</label>
                            <div class="col-12 col-sm-8 d-flex">
                                <input type="file" class="d-none" id="romFile" accept=".sfc,.smc">
                                <button id="btnRomUpload" type="button" class="btn btn-outline-secondary btn-sm">
                                    <i class="bi bi-upload me-2"></i>Choose file
                                </button>
                                <div class="flex-grow-1">
                                    <input type="text" class="form-control font-monospace" id="romFileName" readonly>
                                </div>
                            </div>
                        </div>
                        <div class="row mb-3 align-items-center">
                            <label for="crc32" class="col-12 col-sm-4 col-form-label text-sm-end">CRC32:</label>
                            <div class="col-12 col-sm-8">
                                <input type="text" class="form-control font-monospace" id="crc32" readonly>
                            </div>
                        </div>
                        <div class="row mb-3 align-items-center">
                            <label for="md5" class="col-12 col-sm-4 col-form-label text-sm-end">MD5:</label>
                            <div class="col-12 col-sm-8">
                                <input type="text" class="form-control font-monospace" id="md5" readonly>
                            </div>
                        </div>
                        <div class="row mb-3 align-items-center">
                            <label for="sha1" class="col-12 col-sm-4 col-form-label text-sm-end">SHA-1:</label>
                            <div class="col-12 col-sm-8">
                                <input type="text" class="form-control font-monospace" id="sha1" readonly>
                            </div>
                        </div>
                        <div class="row mb-3 align-items-center">
                            <label for="patchFile" class="col-12 col-sm-4 col-form-label text-sm-end">Patch file:</label>
                            <div class="col-12 col-sm-8">
                                <select class="form-select font-monospace" id="patchFile">
                                    <option value="">Loading…</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mb-3 align-items-center">
                            <label for="description" class="col-12 col-sm-4 col-form-label text-sm-end">Description:</label>
                            <div class="col-12 col-sm-8">
                                <input type="text" class="form-control font-monospace" id="description" readonly>
                            </div>
                        </div>
                        <div class="row mb-3 align-items-center">
                            <label for="requiredCrc32" class="col-12 col-sm-4 col-form-label text-sm-end">Required CRC32:</label>
                            <div class="col-12 col-sm-8">
                                <input type="text" class="form-control font-monospace" id="requiredCrc32" value="A27F1C7A" readonly>
                            </div>
                        </div>
                        <div id="errorMessage" class="mb-3"></div>
                        <div class="text-center">
                            <button id="btnApplyPatch" type="button" class="btn btn-dark" disabled="true">Apply patch</button>
                            <a id="downloadLink" class="btn btn-dark d-none" href="#" download>
                                <i class="bi bi-download me-2"></i>Download patched ROM
                            </a>
                        </div>
                    </div>
                    <div id="patcherOverlay" class="position-absolute top-0 start-0 w-100 h-100 d-none"
                        style="background: rgba(0,0,0,0.5); z-index: 10;">
                        <div class="d-flex flex-column align-items-center justify-content-center h-100 text-white">
                        <div class="spinner-border text-light mb-2" role="status"></div>
                        <span>Patching…</span>
                        </div>
                    </div>
                </div>
                <!-- Collapsible Categories -->
                <div id="categories" class="position-relative mt-2">
                    <!-- Gameplay -->
                    <div id="cat-gameplay" class="card mb-2">
                        <div class="card-header d-flex justify-content-between align-items-center category-header"
                            data-bs-toggle="collapse" data-bs-target="#gameplay"
                            aria-expanded="false" aria-controls="gameplay">
                            <span>Gameplay</span>
                            <i class="bi bi-chevron-down"></i>
                        </div>
                        <div id="gameplay" class="collapse category-content">
                            <div class="card-body category-grid"></div>
                        </div>
                    </div>
                    <!-- Graphics -->
                    <div id="cat-gfx" class="card mb-2">
                        <div class="card-header d-flex justify-content-between align-items-center category-header"
                            data-bs-toggle="collapse" data-bs-target="#gfx"
                            aria-expanded="false" aria-controls="gfx">
                            <span>Graphics</span>
                            <i class="bi bi-chevron-down"></i>
                        </div>
                        <div id="gfx" class="collapse category-content">
                            <div class="card-body category-grid"></div>
                        </div>
                    </div>
                    <!-- Music -->
                    <div id="cat-music" class="card mb-2">
                        <div class="card-header d-flex justify-content-between align-items-center category-header"
                            data-bs-toggle="collapse" data-bs-target="#music"
                            aria-expanded="false" aria-controls="music">
                            <span>Music</span>
                            <i class="bi bi-chevron-down"></i>
                        </div>
                        <div id="music" class="collapse category-content">
                            <div class="card-body category-grid"></div>
                        </div>
                    </div>
                    <!-- Other -->
                    <div id="cat-other" class="card mb-2">
                        <div class="card-header d-flex justify-content-between align-items-center category-header"
                            data-bs-toggle="collapse" data-bs-target="#other"
                            aria-expanded="false" aria-controls="other">
                            <span>Others</span>
                            <i class="bi bi-chevron-down"></i>
                        </div>
                        <div id="other" class="collapse category-content">
                            <div class="card-body category-grid"></div>
                        </div>
                    </div>
                    <!-- Sprite -->
                    <div id="cat-sprite" class="card mb-2">
                        <div class="card-header d-flex justify-content-between align-items-center category-header"
                            data-bs-toggle="collapse" data-bs-target="#sprite"
                            aria-expanded="false" aria-controls="sprite">
                            <span>Sprites</span>
                            <i class="bi bi-chevron-down"></i>
                        </div>
                        <div id="sprite" class="collapse category-content">
                            <div class="card-body category-grid"></div>
                        </div>
                    </div>
                    <!-- OST A -->
                    <div id="cat-osta" class="card mb-2">
                        <div class="card-header d-flex justify-content-between align-items-center category-header"
                            data-bs-toggle="collapse" data-bs-target="#osta"
                            aria-expanded="false" aria-controls="osta">
                            <span>Soundtrack A</span>
                            <i class="bi bi-chevron-down"></i>
                        </div>
                        <div id="osta" class="collapse category-content">
                            <div class="card-body category-grid"></div>
                        </div>
                    </div>
                    <!-- OST B -->
                    <div id="cat-ostb" class="card mb-2">
                        <div class="card-header d-flex justify-content-between align-items-center category-header"
                            data-bs-toggle="collapse" data-bs-target="#ostb"
                            aria-expanded="false" aria-controls="ostb">
                            <span>Soundtrack B</span>
                            <i class="bi bi-chevron-down"></i>
                        </div>
                        <div id="ostb" class="collapse category-content">
                            <div class="card-body category-grid"></div>
                        </div>
                    </div>
                </div>
                <div id="descOverlay" class="d-none descOverlay">
                    <div class="descOverlayContent">
                        <button id="descClose" class="btn-close position-absolute top-0 end-0 m-3"></button>
                        <div id="descContent" class="mt-3 d-flex align-items-center justify-content-center text-center descContent"></div>
                    </div>
                </div>  
            </div>
            <!-- begin smwcentral-spc-player code -->
            <!-- github.com/telinc1/smwcentral-spc-player -->
            <input type="checkbox" id="spc-player-toggle" />
            <input type="checkbox" id="spc-player-loop" checked />
            <div id="spc-player-interface" class="spc-player">
                <div id="spc-player-header" class="header">
                    <div class="group-left">
                        <label for="spc-player-toggle" class="toggle header-button" title="Toggle player">
                            <svg width="24" height="24" viewBox="0 0 24 24" class="shrink">
                                <path d="m 9,5 3,3 3,-3 z m -4,6 v 2 h 14 v -2 z m 7,5 -3,3 h 6 z" />
                            </svg>
                            <svg width="24" height="24" viewBox="0 0 24 24" class="expand">
                                <path d="m 9,7 3,-3 3,3 z m -4,4 v 2 h 14 v -2 z m 7,9 -2.798151,-3 H 15 Z" />
                            </svg>
                        </label>
                        <span>SPC Player</span>
                    </div>
                    <div class="now-playing">
                        <span class="title"></span>
                    </div>
                    <div class="group-right">
                        <a class="stop close header-button" title="Close">
                            <svg width="24" height="24" viewBox="0 0 24 24">
                                <path
                                    d="M 7.3847656,5.6152344 5.6152344,7.3847656 10.230469,12 5.6152344,16.615234 7.3847656,18.384766 12,13.769531 16.615234,18.384766 18.384766,16.615234 13.769531,12 18.384766,7.3847656 16.615234,5.6152344 12,10.230469 Z"
                                />
                            </svg>
                        </a>
                    </div>
                </div>
                <div id="spc-player-content" class="player-content">
                    <div class="track-info">
                        <h2 class="title">Song Title</h2>
                        <h3 class="subtitle"></h3>
                        <div class="details"></div>
                    </div>
                    <div class="seek-container">
                        <span class="track-time-elapsed"></span>
                        <div class="seek"><span class="seek-preview"></span></div>
                        <span class="track-duration"></span>
                    </div>
                    <div id="spc-player-controls" class="controls">
                        <div class="group-left">
                            <a class="play hidden" title="Resume song">
                                <svg width="24" height="24" viewBox="0 0 24 24"><path d="M7 5v14l12-7Z" /></svg>
                            </a>
                            <a class="pause" title="Pause song">
                                <svg width="24" height="24" viewBox="0 0 24 24">
                                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                                </svg>
                            </a>
                            <a id="spc-player-skip" class="hidden" title="Skip song">
                                <svg height="24" viewBox="0 0 24 24" width="24">
                                    <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
                                </svg>
                            </a>
                            <a class="restart" title="Restart song">
                                <svg width="24" height="24" viewBox="0 0 24 24">
                                    <path
                                        d="M 12,5 V 1 l -5,5 5,5 V 7 c 3.31,0 6,2.69 6,6 0,3.31 -2.69,6 -6,6 C 8.69,19 6,16.31 6,13 H 4 c 0,4.42 3.58,8 8,8 4.42,0 8,-3.58 8,-8 0,-4.42 -3.58,-8 -8,-8 z"
                                    />
                                </svg>
                            </a>
                            <label for="spc-player-loop" class="loop" title="Toggle looping">
                                <svg width="24" height="24" viewBox="0 0 24 24">
                                    <path
                                        d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"
                                    />
                                </svg>
                            </label>
                        </div>
                        <div id="spc-player-volume" class="volume">
                            <span class="volume-level">100%</span>
                            <svg width="24" height="24" viewBox="0 0 24 24">
                                <path
                                    d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"
                                />
                            </svg>
                            <div class="volume-control">
                                <input type="range" id="volume-slider" title="Volume" />
                                <div class="volume-track">
                                    <div class="volume-fill"></div>
                                    <div class="volume-thumb"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div id="track-list-container" class="hidden">
                        <div class="overflow-indicator top"></div>
                        <div class="track-list-scrollbox">
                            <ul class="track-list"></ul>
                        </div>
                        <div class="overflow-indicator bottom"></div>
                    </div>
                    <div id="spc-player-up-next" class="up-next hidden">
                        <span>Up Next: </span><a id="spc-player-up-next-link" title="Opens in a new tab" target="_blank"></a>
                    </div>
                </div>
            </div>
            <!-- end smwcentral-spc-player code -->
        </main>
        {% include 'footer.html' %}
        {% include 'scripts.html' %}
        {% include 'monsterspage.html' %}
    </body>
</html>
