        <main class="flex-grow-1">
            <div class="d-flex justify-content-center mt-2">
                <h3 id="pageTitle">
                    Patcher
                </h3>
            </div>
            <div>
                <div class="card patcher-card position-relative">
                    <div class="card-body">
                        <div class="row mb-3 align-items-center">
                            <label class="col-sm-4 col-form-label text-end" for="romFile">
                                ROM file:
                            </label>
                            <div class="col-sm-8 d-flex">
                                <input accept=".sfc,.smc" class="d-none" id="romFile" type="file"/>
                                <button class="btn btn-outline-secondary btn-sm" id="btnRomUpload" type="button">
                                    <i class="bi bi-upload me-2">
                                    </i>
                                    Choose file
                                </button>
                                <div class="col-sm-8">
                                    <input class="form-control font-monospace" id="romFileName" readonly="" type="text"/>
                                </div>
                            </div>
                        </div>
                        <div class="row mb-3 align-items-center">
                            <label class="col-sm-4 col-form-label text-end" for="crc32">
                                CRC32:
                            </label>
                            <div class="col-sm-8">
                                <input class="form-control font-monospace" id="crc32" readonly="" type="text"/>
                            </div>
                        </div>
                        <div class="row mb-3 align-items-center">
                            <label class="col-sm-4 col-form-label text-end" for="md5">
                                MD5:
                            </label>
                            <div class="col-sm-8">
                                <input class="form-control font-monospace" id="md5" readonly="" type="text"/>
                            </div>
                        </div>
                        <div class="row mb-3 align-items-center">
                            <label class="col-sm-4 col-form-label text-end" for="sha1">
                                SHA-1:
                            </label>
                            <div class="col-sm-8">
                                <input class="form-control font-monospace" id="sha1" readonly="" type="text"/>
                            </div>
                        </div>
                        <div class="row mb-3 align-items-center">
                            <label class="col-sm-4 col-form-label text-end" for="patchFile">
                                Patch file:
                            </label>
                            <div class="col-sm-8">
                                <input class="form-control font-monospace" id="patchFile" readonly="" type="text" value="rotds_v213.ips"/>
                            </div>
                        </div>
                        <div class="row mb-3 align-items-center">
                            <label class="col-sm-4 col-form-label text-end" for="description">
                                Description:
                            </label>
                            <div class="col-sm-8">
                                <input class="form-control font-monospace" id="description" readonly="" type="text" value="RotDS v2.13 base patch"/>
                            </div>
                        </div>
                        <div class="row mb-3 align-items-center">
                            <label class="col-sm-4 col-form-label text-end" for="requiredCrc32">
                                Required CRC32:
                            </label>
                            <div class="col-sm-8">
                                <input class="form-control font-monospace" id="requiredCrc32" readonly="" type="text" value="A27F1C7A"/>
                            </div>
                        </div>
                        <div class="mb-3" id="errorMessage">
                        </div>
                        <div class="text-center">
                            <button class="btn btn-dark" disabled="true" id="btnApplyPatch" type="button">
                                Apply patch
                            </button>
                            <a class="btn btn-dark d-none" download="" href="#" id="downloadLink">
                                <i class="bi bi-download me-2">
                                </i>
                                Download patched ROM
                            </a>
                        </div>
                    </div>
                    <div class="position-absolute top-0 start-0 w-100 h-100 d-none" id="patcherOverlay" style="background: rgba(0,0,0,0.5); z-index: 10;">
                        <div class="d-flex flex-column align-items-center justify-content-center h-100 text-white">
                            <div class="spinner-border text-light mb-2" role="status">
                            </div>
                            <span>
                                Patching…
                            </span>
                        </div>
                    </div>

        <script>
            initSessionVar("monster_gallery_page", 1);
            var href = $("#menu-monsters").attr("href");
            var array = href.split("/");
            array.pop();
            array.push(MonstersPage[parseInt(sessionStorage.getItem("monster_gallery_page"))-1]);
            var path = array.join("/");
            $("#menu-monsters").attr("href", path);
